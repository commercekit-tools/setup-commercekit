name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and committed bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm quality

  integration:
    name: Install CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2025
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CommerceKit CLI
        id: setup
        uses: ./
        with:
          version: '0.1.0-preview.2'

      - name: Reuse verified CommerceKit CLI
        id: setup-again
        uses: ./
        with:
          version: '0.1.0-preview.2'

      - name: Verify outputs and CLI
        env:
          CK_BUILD_ID: ${{ steps.setup-again.outputs.build-id }}
          CK_CACHE_HIT: ${{ steps.setup-again.outputs.cache-hit }}
          CK_EXPECTED_CACHE_HIT: 'true'
          CK_EXPECTED_TARGET: ${{ matrix.target }}
          CK_PATH: ${{ steps.setup-again.outputs.path }}
          CK_TARGET: ${{ steps.setup-again.outputs.target }}
          CK_VERSION: ${{ steps.setup-again.outputs.version }}
        run: node scripts/verify-action.mjs
